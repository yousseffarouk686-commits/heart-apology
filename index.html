<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسالة خاصة لآدم 💖</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      overflow: hidden;
      position: relative;
      transition: background 0.5s ease;
    }

    /* خلفية القلوب المتحركة */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .heart-bg {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      animation: float 6s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* كارت المحتوى */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 90%;
      z-index: 10;
      border: 2px solid rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    h1 {
      color: #d63384;
      font-size: 26px;
      margin-bottom: 20px;
      transition: color 0.3s ease;
    }

    .input-group {
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #ffb6c1;
      border-radius: 50px;
      outline: none;
      font-size: 18px;
      text-align: center;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #d63384;
      box-shadow: 0 0 12px rgba(214, 51, 132, 0.3);
    }

    /* وضع المقلب */
    body.prank-mode {
      background: #1a0003 !important;
    }

    .prank-card {
      background: #ff003c !important;
      color: #fff !important;
      border-color: #ff0000 !important;
      animation: shake 0.15s infinite;
      box-shadow: 0 0 40px #ff003c !important;
    }

    .prank-card h1 {
      color: #ffffff !important;
      font-size: 32px !important;
      font-weight: 900;
      text-shadow: 2px 2px #000;
    }

    @keyframes shake {
      0% { transform: translate(2px, 2px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(2deg); }
      40% { transform: translate(1px, -1px) rotate(-1deg); }
      60% { transform: translate(-2px, 2px) rotate(1deg); }
      80% { transform: translate(3px, 1px) rotate(-2deg); }
      100% { transform: translate(1px, -2px) rotate(0deg); }
    }

    /* وضع النتيجة النهائية */
    .final-message {
      display: none;
      font-size: 24px;
      color: #d63384;
      font-weight: bold;
      line-height: 1.6;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="bg-hearts" id="heartsContainer"></div>

  <div class="card" id="mainCard">
    <div id="step1">
      <h1>يا آدم اكتب "اسف" هنا 💖</h1>
      <div class="input-group">
        <input type="text" id="userInput" placeholder="اكتب اسف هنا..." autocomplete="off">
      </div>
    </div>
    
    <div id="step2" class="final-message">
      كنت بهزر معاك 😜<br>
      وأنا كمان أسف وبحبك يا عم ❤️✨
    </div>
  </div>

  <script>
    // إنشاء القلوب الخلفية
    const heartsContainer = document.getElementById('heartsContainer');
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    let heartInterval = setInterval(createHeart, 300);

    // الاستماع لإدخال الكلمة
    const input = document.getElementById('userInput');
    const card = document.getElementById('mainCard');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');

    input.addEventListener('input', function() {
      const value = this.value.trim().toLowerCase();
      
      // التشيك على كلمة اسف
      if (value === 'اسف' || value === 'آسف' || value === 'أسف') {
        input.blur();
        
        // 1. تفعيل المقلب
        document.body.classList.add('prank-mode');
        card.classList.add('prank-card');
        step1.querySelector('h1').innerText = "ضحكت عليك يا معرص 😈💥";
        input.style.display = 'none';

        // 2. بعد 1.8 ثانية: الصلح والرومانسية
        setTimeout(() => {
          document.body.classList.remove('prank-mode');
          card.classList.remove('prank-card');
          step1.style.display = 'none';
          step2.style.display = 'block';

          // مطر قلوب (Confetti)
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ff4d6d', '#ff758f', '#ffb3c1']
          });

          // تسريع خلفية القلوب
          clearInterval(heartInterval);
          setInterval(createHeart, 100);

        }, 1800);
      }
    });
  </script>
</body>
</html>
